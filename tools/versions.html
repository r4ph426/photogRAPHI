<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick versions</title>
<link href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500&display=swap" rel="stylesheet">
<style>
  :root { --paper: #F4F3EF; --ink: #111; --grey: #6B6B6B; --signal: #FF3B1F; --m: 40px; --g: 24px; }
  @media (prefers-color-scheme: dark) { :root { --paper: #0F0F0E; --ink: #EDEBE6; --grey: #8F8D88; } }
  @media (max-width: 600px) { :root { --m: 16px; --g: 16px; } }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font: 400 14px/1.35 "Switzer", "Helvetica Neue", Arial, sans-serif; padding: 0 var(--m) 120px; -webkit-font-smoothing: antialiased; }
  header { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: var(--g); padding: 40px 0 40px; }
  h1 { grid-column: 1 / 8; font-size: clamp(2.75rem, 5.5vw, 5rem); font-weight: 300; line-height: 1; letter-spacing: -.025em; }
  h1 span { color: var(--grey); }
  header p { grid-column: 9 / 13; align-self: end; color: var(--grey); max-width: 40ch; }
  section { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: var(--g); padding: 24px 0; border-top: 1px solid var(--ink); }
  .n { grid-column: 1 / 2; font-size: 44px; font-weight: 300; line-height: 1; letter-spacing: -.015em; font-variant-numeric: tabular-nums; }
  .meta { grid-column: 2 / 4; color: var(--grey); padding-top: 4px; }
  .opts { grid-column: 4 / 13; display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--g); }
  button.opt { background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .opt .img { position: relative; aspect-ratio: 3 / 2; background: color-mix(in srgb, var(--ink) 6%, transparent); display: flex; align-items: center; justify-content: center; outline: 2px solid transparent; outline-offset: 4px; transition: outline-color .2s, opacity .2s; }
  .opt img { max-width: 100%; max-height: 100%; display: block; }
  .opt .cap { display: flex; justify-content: space-between; padding-top: 8px; }
  .opt .state { color: var(--grey); }
  .opt[aria-pressed="true"] .img { outline-color: var(--signal); }
  .opt[aria-pressed="true"] .state { color: var(--signal); }
  .opt[aria-pressed="false"] .img { opacity: .45; }
  .opt:focus-visible { outline: 2px solid var(--signal); outline-offset: 4px; }
  .warn { grid-column: 4 / 13; color: var(--signal); padding-top: 8px; min-height: 1.35em; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: var(--g); align-items: center; padding: 16px var(--m) max(16px, env(safe-area-inset-bottom)); background: var(--paper); border-top: 1px solid var(--ink); }
  footer .count { flex: 1; font-variant-numeric: tabular-nums; }
  footer button { font: inherit; border: 0; cursor: pointer; min-height: 44px; padding: 0 20px; }
  #save { background: var(--ink); color: var(--paper); }
  #save:hover { background: var(--signal); color: #fff; }
  #reset { background: none; color: var(--ink); text-decoration: underline; text-underline-offset: .2em; text-decoration-thickness: 1px; padding: 0; }
  #status { color: var(--grey); }
  @media (max-width: 834px) { .n { grid-column: 1 / 3; } .meta { grid-column: 3 / 13; } .opts, .warn { grid-column: 1 / 13; margin-top: 16px; } header p { grid-column: 1 / 13; margin-top: 16px; } h1 { grid-column: 1 / 13; } }
  @media (max-width: 600px) { .opts { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Pick versions <span>to keep.</span></h1>
  <p>Frames with more than one edit. Click to toggle. Everything marked red stays on the canvas, the rest gets hidden (files stay in the folder). Keep one or several.</p>
</header>
<main id="list"></main>
<footer>
  <span class="count" id="count"></span>
  <span id="status" aria-live="polite"></span>
  <button id="reset" type="button">Reset to latest</button>
  <button id="save" type="button">Save choices</button>
</footer>
<script type="module">
const $ = s => document.querySelector(s);
const all = await (await fetch('../photos/photos.json', { cache: 'no-store' })).json();
const groups = [...Map.groupBy(all, p => p.key).values()].filter(g => g.length > 1);
// the file-name tail after the scan number, e.g. "_Processed-2" or "-processed", tells otherwise identical names apart
const label = p => p.file.replace(/^.*scan\d+/i, '').replace(/\.[a-z]+$/i, '') || p.file;
const latest = g => g.reduce((a, b) => (b.version > a.version ? b : a));
const keep = new Set();
const defaults = () => { keep.clear(); for (const g of groups) { const kept = g.filter(p => !p.hidden); (kept.length && kept.length < g.length ? kept : [latest(g)]).forEach(p => keep.add(p.file)); } };
defaults();

$('#list').innerHTML = groups.map((g, i) => `
  <section data-g="${i}">
    <div class="n">${i + 1}</div>
    <div class="meta">${g[0].stock}<br>Frame ${g[0].frame}<br>${g[0].date}</div>
    <div class="opts">${g.sort((a, b) => a.version - b.version).map(p => `
      <button type="button" class="opt" data-file="${p.file}">
        <div class="img"><img src="../${p.src}" alt="${label(p)}, frame ${p.frame}" loading="lazy"></div>
        <div class="cap"><span>${label(p)}</span><span class="state"></span></div>
      </button>`).join('')}
    </div>
    <p class="warn"></p>
  </section>`).join('');

function render() {
  document.querySelectorAll('.opt').forEach(b => {
    const on = keep.has(b.dataset.file);
    b.setAttribute('aria-pressed', on);
    b.querySelector('.state').textContent = on ? 'keep' : 'hide';
  });
  document.querySelectorAll('section').forEach(s => {
    const none = ![...s.querySelectorAll('.opt')].some(b => keep.has(b.dataset.file));
    s.querySelector('.warn').textContent = none ? 'Nothing kept: this frame disappears from the site.' : '';
  });
  const hidden = groups.flat().filter(p => !keep.has(p.file)).length;
  $('#count').textContent = `${groups.length} frames · ${keep.size} kept · ${hidden} hidden`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('.opt'); if (!b) return;
  keep.has(b.dataset.file) ? keep.delete(b.dataset.file) : keep.add(b.dataset.file);
  $('#status').textContent = ''; render();
});
$('#reset').addEventListener('click', () => { defaults(); render(); });
$('#save').addEventListener('click', async () => {
  const hide = groups.flat().filter(p => !keep.has(p.file)).map(p => p.file);
  $('#status').textContent = 'Saving';
  try {
    const r = await fetch('/api/versions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ keep: [...keep], hide }) });
    if (!r.ok) throw new Error(await r.text());
    $('#status').textContent = 'Saved. Tell Claude you are done.';
  } catch (err) { $('#status').textContent = `Could not save (${err.message}).`; }
});
render();
</script>
</body>
</html>
