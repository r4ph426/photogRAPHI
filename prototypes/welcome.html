<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>photogRAPHI welcome</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=switzer@300,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4F3EF; --ink: #111111; --grey: #6B6B6B; --signal: #FF3B1F; --night: #0F0F0E; --moon: #EDEBE6;
    --m: 40px; --g: 24px;
    --ease: cubic-bezier(.2, 0, 0, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  }
  @media (max-width: 834px) { :root { --m: 32px; --g: 20px; } }
  @media (max-width: 600px) { :root { --m: 16px; --g: 16px; } }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Switzer", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px; line-height: 1.35; -webkit-font-smoothing: antialiased;
    background: var(--bg); color: var(--fg);
    transition: background-color .3s var(--ease), color .3s var(--ease);
  }
  body[data-v="1"] { --bg: var(--night); --fg: var(--moon); --dim: #8F8D88; }
  body[data-v="2"] { --bg: var(--paper); --fg: var(--ink); --dim: var(--grey); }
  body[data-v="3"] { --bg: var(--signal); --fg: var(--ink); --dim: rgba(17,17,17,.62); }

  a, button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; }
  a:focus-visible, button:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }

  /* chrome: same bar on every direction, only colors change */
  .bar {
    position: fixed; left: 0; right: 0; z-index: 5;
    display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--g);
    padding: 0 var(--m); align-items: center;
  }
  .top { top: 0; height: 64px; }
  .bottom { bottom: 0; height: 64px; padding-bottom: env(safe-area-inset-bottom); }
  .modes { grid-column: 1 / 7; display: flex; gap: var(--g); }
  .modes button { color: var(--dim); }
  .modes button .n { font-variant-numeric: tabular-nums; margin-right: 6px; }
  .modes button[aria-pressed="true"] { color: var(--fg); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .2em; }
  .enter { grid-column: 11 / 13; }
  .enter:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .2em; }
  .note { grid-column: 1 / 7; color: var(--dim); }
  .count { grid-column: 7 / 11; color: var(--dim); font-variant-numeric: tabular-nums; }
  .keys { grid-column: 11 / 13; color: var(--dim); }
  @media (max-width: 600px) {
    .bar { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .modes { grid-column: 1 / 4; gap: 16px; }
    .enter { grid-column: 4 / 5; text-align: right; }
    .note { grid-column: 1 / 4; }
    .count { grid-column: 4 / 5; text-align: right; }
    .keys { display: none; }
  }

  .dir { position: fixed; inset: 0; display: none; }
  body[data-v="1"] .v1, body[data-v="2"] .v2, body[data-v="3"] .v3 { display: block; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .line { display: block; white-space: nowrap; }

  /* ── v1 Departures: split-flap, night board, per-letter flips ───────── */
  .v1 .say {
    position: absolute; left: var(--m); bottom: calc(64px + 5vh);
    font-weight: 300; letter-spacing: -.02em; line-height: 1;
    font-size: clamp(52px, 11.5vw, 210px);
  }
  .v1 .lead { color: var(--dim); margin-bottom: .12em; }
  .board { display: flex; gap: .035em; }
  .cell {
    position: relative; width: .56em; height: 1.24em;
    perspective: 3em;
  }
  .cell span {
    position: absolute; inset: 0; display: block; text-align: center; line-height: 1.16em;
    letter-spacing: 0; backface-visibility: hidden;
  }
  .cell .t, .cell .ft { clip-path: inset(0 0 50% 0); }
  .cell .b, .cell .fb { clip-path: inset(50% 0 0 0); }
  .cell .ft, .cell .fb { transform-origin: 50% 50%; visibility: hidden; }
  /* the hinge: the only trace of the board is the gap through every glyph */
  .cell::after {
    content: ""; position: absolute; left: 0; right: 0; top: calc(50% - .018em); height: .036em;
    background: var(--bg); z-index: 3;
  }
  .cell.still { color: var(--fg); }

  /* ── v2 Reel: paper, the suffix scrolls up through a gate ─────────────── */
  .v2 .say {
    position: absolute; left: var(--m); top: calc(64px + 9vh);
    font-weight: 300; letter-spacing: -.035em; line-height: .96;
    font-size: clamp(56px, 13.2vw, 240px);
  }
  .v2 .lead { color: var(--grey); }
  .reel {
    display: inline-block; vertical-align: top; overflow: hidden; overflow: clip;
    height: 1.2em; margin-top: -.1em; padding-top: .1em; /* room for caps and descenders */
    position: relative;
  }
  .reel .strip { display: block; will-change: transform; }
  .reel .w { display: block; height: 1.2em; }
  .reel .caps { color: var(--signal); letter-spacing: -.015em; }

  /* ── v3 Safelight: red field, film advances left, next frame peeks in ─── */
  .v3 .say {
    position: absolute; left: var(--m); right: 0; bottom: calc(64px + 6vh);
    font-weight: 300; letter-spacing: -.045em; line-height: .86;
    font-size: clamp(48px, 16vw, 320px);
  }
  .v3 .lead { color: var(--fg); }
  .v3 .last { display: flex; align-items: baseline; }
  .gate {
    flex: 1 1 auto; min-width: 0; overflow: hidden; overflow: clip;
    padding: .08em 0 .16em; margin: -.08em 0 -.16em; /* keep ascenders and descenders */
  }
  .film { display: flex; gap: .28em; will-change: transform; }
  .film span { flex: none; transition: opacity .6s var(--ease); }
  .film span.next { opacity: .32; }

  @media (prefers-reduced-motion: reduce) {
    .film span { transition: none; }
  }
</style>
</head>
<body data-v="1">

<header class="bar top">
  <nav class="modes" aria-label="Direction">
    <button data-v="1"><span class="n">v1</span>departures</button>
    <button data-v="2"><span class="n">v2</span>reel</button>
    <button data-v="3"><span class="n">v3</span>safelight</button>
  </nav>
  <a class="enter" href="../index.html">enter →</a>
</header>

<!-- v1 -->
<section class="dir v1" aria-hidden="true">
  <h1 class="say">
    <span class="sr">welcome to my photography</span>
    <span class="line lead" aria-hidden="true">welcome to my</span>
    <span class="board" id="board" aria-hidden="true"></span>
  </h1>
</section>

<!-- v2 -->
<section class="dir v2" aria-hidden="true">
  <h1 class="say">
    <span class="sr">welcome to my photography</span>
    <span class="line lead" aria-hidden="true">welcome</span>
    <span class="line lead" aria-hidden="true">to my</span>
    <span class="line" aria-hidden="true">photog<span class="reel"><span class="strip" id="strip"><span class="w">raphy</span><span class="w caps">RAPHI</span></span></span></span>
  </h1>
</section>

<!-- v3 -->
<section class="dir v3" aria-hidden="true">
  <h1 class="say">
    <span class="sr">welcome to my photography</span>
    <span class="line lead" aria-hidden="true">welcome</span>
    <span class="line lead" aria-hidden="true">to my</span>
    <span class="line last" aria-hidden="true">photog<span class="gate"><span class="film" id="film"></span></span></span>
  </h1>
</section>

<footer class="bar bottom">
  <p class="note">Mostly analog photography by Raphi.</p>
  <p class="count" id="count"></p>
  <p class="keys">keys 1 2 3</p>
</footer>

<script>
  // One clock for all three: hold a word, move to the next, forever.
  // Each loop awaits its own motion before holding again, so steps never overlap
  // (a throttled background tab just pauses the loop instead of corrupting it).
  const HOLD = 2600;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const WORDS = ['raphy', 'RAPHI'];
  const IN_OUT = 'cubic-bezier(0.77, 0, 0.175, 1)';

  let run = 0;                               // bumps on every switch; old loops see it and stop
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function loop(step) {
    const me = ++run;
    while (true) {
      await sleep(HOLD);
      if (me !== run) return;
      try { await step(); } catch (e) { return; }   // a switch cancels the motion mid-step
      if (me !== run) return;
    }
  }

  // ── direction switcher ──────────────────────────────────────────────
  const body = document.body;
  const buttons = [...document.querySelectorAll('.modes button')];
  function show(v) {
    run++;
    document.getAnimations().forEach(a => a.cancel());
    body.dataset.v = v;
    buttons.forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
    document.querySelectorAll('.dir').forEach(d => d.setAttribute('aria-hidden', !d.classList.contains('v' + v)));
    try { history.replaceState(null, '', '#v' + v); } catch (e) {}
    ({ 1: startBoard, 2: startReel, 3: startFilm })[v]();
  }
  buttons.forEach(b => b.addEventListener('click', () => show(b.dataset.v)));
  addEventListener('keydown', e => { if (['1', '2', '3'].includes(e.key)) show(e.key); });

  // ── v1 departures ───────────────────────────────────────────────────
  const DRUM = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const STEP = 120;           // one card falling, ms
  const STAGGER = 70;         // left to right, like a board updating
  const FALL = 'cubic-bezier(.5, 0, 1, 1)';   // gravity: a card falls, it does not ease out
  const board = document.getElementById('board');
  const cells = [];
  function cell(ch, still) {
    const c = document.createElement('span');
    c.className = 'cell' + (still ? ' still' : '');
    c.innerHTML = `<span class="t">${ch}</span><span class="b">${ch}</span><span class="ft"></span><span class="fb"></span>`;
    board.appendChild(c);
    return c;
  }
  'photog'.split('').forEach(ch => cell(ch, true));
  WORDS[0].split('').forEach(ch => cells.push(cell(ch)));

  async function flap(c, from, to) {
    const [t, b, ft, fb] = c.children;
    ft.textContent = from; fb.textContent = to;
    t.textContent = to;                      // the next card waits behind the falling top
    ft.style.visibility = 'visible';
    const a1 = ft.animate([{ transform: 'rotateX(0deg)' }, { transform: 'rotateX(-90deg)' }],
      { duration: STEP / 2, easing: FALL, fill: 'forwards' });
    await a1.finished;
    ft.style.visibility = 'hidden'; a1.cancel();
    fb.style.visibility = 'visible';
    const a2 = fb.animate([{ transform: 'rotateX(90deg)' }, { transform: 'rotateX(0deg)' }],
      { duration: STEP / 2, easing: FALL, fill: 'forwards' });
    await a2.finished;
    b.textContent = to;
    fb.style.visibility = 'hidden'; a2.cancel();
  }
  // Each card runs through a few letters on the drum before it lands.
  function path(from, to) {
    const i = DRUM.indexOf(from), steps = [];
    const hops = 2 + Math.floor(Math.random() * 3);
    for (let k = 0; k < hops; k++) steps.push(DRUM[(i + 1 + k * 7 + Math.floor(Math.random() * 5)) % DRUM.length]);
    return [...steps, to];
  }
  function setBoard(word) {
    cells.forEach((c, i) => {
      c.children[0].textContent = c.children[1].textContent = word[i];
      c.children[2].style.visibility = c.children[3].style.visibility = 'hidden';
    });
  }
  let boardAt = 0;
  function startBoard() {
    setBoard(WORDS[boardAt]);
    const me = run + 1;                      // the id loop() is about to take
    loop(async () => {
      const from = WORDS[boardAt], to = WORDS[1 - boardAt];
      boardAt = 1 - boardAt;
      if (reduce) return setBoard(to);
      await Promise.all(cells.map(async (c, i) => {
        await sleep(i * STAGGER);
        let cur = from[i];
        for (const ch of path(from[i], to[i])) { if (me !== run) return; await flap(c, cur, ch); cur = ch; }
      }));
    });
  }

  // ── v2 reel ─────────────────────────────────────────────────────────
  const strip = document.getElementById('strip');
  const ROLL = 950;
  let reelAt = 0;
  const word = i => `<span class="w${i ? ' caps' : ''}">${WORDS[i]}</span>`;
  function startReel() {
    strip.innerHTML = word(reelAt);
    loop(async () => {
      reelAt = 1 - reelAt;
      strip.insertAdjacentHTML('beforeend', word(reelAt));   // next word waits below the gate
      const a = strip.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-50%)' }],
        { duration: reduce ? 1 : ROLL, easing: IN_OUT, fill: 'forwards' });
      await a.finished;
      strip.firstElementChild.remove(); a.cancel();          // swap under the held frame, nothing flashes
    });
  }

  // ── v3 safelight ────────────────────────────────────────────────────
  const film = document.getElementById('film');
  const ADVANCE = 1150;
  let filmAt = 0;
  function frame(i) {
    const s = document.createElement('span');
    s.textContent = WORDS[i % 2];
    return s;
  }
  function startFilm() {
    film.innerHTML = '';
    film.append(frame(filmAt), frame(filmAt + 1), frame(filmAt + 2));
    film.children[1].classList.add('next');
    loop(async () => {
      const [cur, nxt] = film.children;
      const dx = nxt.offsetLeft - cur.offsetLeft;
      nxt.classList.remove('next');
      const a = film.animate([{ transform: 'translateX(0)' }, { transform: `translateX(${-dx}px)` }],
        { duration: reduce ? 1 : ADVANCE, easing: IN_OUT, fill: 'forwards' });
      await a.finished;
      cur.remove(); a.cancel(); filmAt++;
      film.children[1].classList.add('next');
      film.append(frame(filmAt + 2));
    });
  }

  // Real count from the manifest, only when the site is served.
  fetch('../photos/photos.json').then(r => r.json()).then(p => {
    document.getElementById('count').textContent = p.filter(x => !x.hidden).length + ' frames';
  }).catch(() => {});

  const start = (location.hash.match(/^#v([123])$/) || [])[1] || '1';
  document.fonts.ready.then(() => show(start));
</script>
</body>
</html>
