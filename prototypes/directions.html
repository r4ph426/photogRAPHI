<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>photogRAPHI directions</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4F3EF; --ink: #111111; --grey: #6B6B6B; --signal: #FF3B1F;
    --m: 40px; --g: 24px; --ease: cubic-bezier(.2, 0, 0, 1);
  }
  :root[data-theme="dark"] { --paper: #0F0F0E; --ink: #EDEBE6; --grey: #8F8D88; }
  @media (max-width: 834px) { :root { --m: 32px; --g: 20px; } }
  @media (max-width: 600px) { :root { --m: 16px; --g: 16px; } }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Switzer", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px; line-height: 1.35; -webkit-font-smoothing: antialiased;
    transition: background-color .25s var(--ease), color .25s var(--ease);
  }
  button, label { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-align: left; }
  button:focus-visible, label:focus-within { outline: 2px solid var(--signal); outline-offset: 4px; }

  #stage { position: fixed; inset: 0; transition: opacity .28s var(--ease); }
  #stage.out { opacity: 0; }
  #stage canvas { display: block; touch-action: none; cursor: grab; }
  #stage canvas.drag { cursor: grabbing; }
  #stage canvas.point { cursor: pointer; }

  .bar {
    position: fixed; left: 0; right: 0; z-index: 3;
    display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--g);
    padding: 0 var(--m); background: var(--paper);
    transition: background-color .25s var(--ease);
  }
  .top { top: 0; height: 64px; align-items: center; }
  .bottom { bottom: 0; min-height: 80px; padding-top: 16px; padding-bottom: max(20px, env(safe-area-inset-bottom)); align-items: start; }

  .mark { grid-column: 1 / 4; font-size: 20px; letter-spacing: -.005em; color: var(--ink); text-decoration: none; }
  .mark .t { color: var(--grey); }
  .modes { grid-column: 5 / 10; display: flex; gap: var(--g); }
  .modes .n { font-variant-numeric: tabular-nums; color: var(--grey); margin-right: 6px; }
  .modes button:hover, .modes button:hover .n { color: var(--signal); }
  .modes button[aria-pressed="true"] { color: var(--signal); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .2em; }
  .modes button[aria-pressed="true"] .n { color: var(--signal); }

  .cap { grid-column: 1 / 4; font-variant-numeric: tabular-nums; }
  .cap span { display: block; }
  .cap .s { color: var(--grey); }
  .about { grid-column: 5 / 10; max-width: 62ch; }
  .about .hint { color: var(--grey); }
  .acts { grid-column: 10 / 13; display: flex; flex-direction: column; align-items: flex-start; }
  .acts button:hover, .acts label:hover { color: var(--signal); }
  .acts button[aria-pressed="true"] { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .2em; }
  .plus { color: var(--signal); }

  #big {
    position: fixed; left: var(--m); bottom: calc(80px - .17em); z-index: 2;
    font-size: clamp(5rem, 14vw, 10rem); font-weight: 300; line-height: 1; letter-spacing: -.025em;
    font-variant-numeric: tabular-nums; pointer-events: none;
    opacity: 0; transform: translateY(16px);
    transition: opacity .3s var(--ease), transform .3s var(--ease);
  }
  #big.on { opacity: 1; transform: none; }

  #loading { position: fixed; left: var(--m); top: 96px; z-index: 4; font-variant-numeric: tabular-nums; }
  #drop { position: fixed; inset: 0; z-index: 10; display: none; padding: 96px var(--m); background: var(--paper); }
  #drop.on { display: block; }
  #drop p { font-size: clamp(2.75rem, 5.5vw, 5rem); font-weight: 300; line-height: 1; letter-spacing: -.025em; max-width: 12ch; }
  #drop p span { color: var(--grey); }
  #drop small { display: block; margin-top: 40px; font-size: 14px; color: var(--grey); max-width: 44ch; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (max-width: 834px) {
    .mark { grid-column: 1 / 3; } .modes { grid-column: 4 / 9; }
    .cap { grid-column: 1 / 3; } .about { grid-column: 3 / 7; } .acts { grid-column: 7 / 9; }
  }
  @media (max-width: 600px) {
    .bar { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .top { height: auto; padding-top: 14px; padding-bottom: 12px; row-gap: 6px; }
    .mark, .modes { grid-column: 1 / 5; }
    .about { display: none; }
    .cap { grid-column: 1 / 3; } .acts { grid-column: 3 / 5; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="bar top">
  <a class="mark" href="#"><span class="t">photog</span>RAPHI</a>
  <nav class="modes" aria-label="Direction">
    <button data-mode="canvas"><span class="n">01</span>canvas</button>
    <button data-mode="tunnel"><span class="n">02</span>tunnel</button>
    <button data-mode="room"><span class="n">03</span>room</button>
  </nav>
</header>

<main id="stage" aria-label="Photo space"></main>
<div id="big" aria-hidden="true"></div>
<p id="loading">Developing</p>

<footer class="bar bottom">
  <p class="cap" aria-live="polite"><span class="f" id="capF">Hover a frame</span><span class="s" id="capS">&nbsp;</span></p>
  <div class="about"><p id="aboutT"></p><p class="hint" id="aboutH"></p></div>
  <div class="acts">
    <button id="themeBtn" aria-pressed="false">darkroom</button>
    <label><span class="plus">+</span> your scans<input type="file" id="file" accept="image/*" multiple class="sr"></label>
  </div>
</footer>

<div id="drop"><p>Drop to hang <span>your scans.</span></p><small>Tip: put the film stock and frame number in the file name, like portra400_23A.jpg, and they show up as captions. Nothing leaves your computer.</small></div>

/* ---------- 01 canvas ---------- */
const VS = /* glsl */`
uniform vec2 uVel; uniform vec3 uCam;
varying vec2 vUv;
void main() {
  vUv = uv;
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vec2 d = (wp.xy - uCam.xy) / uCam.z;
  float sp = min(length(uVel), 0.08);
  wp.z -= dot(d, d) * sp * uCam.z * 6.0;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;
const FS = /* glsl */`
uniform sampler2D map; uniform float uAlpha; uniform vec2 uVel;
varying vec2 vUv;
void main() {
  vec2 sh = clamp(uVel, -0.08, 0.08) * 0.2;
  vec4 c = texture2D(map, vUv);
  c.r = texture2D(map, vUv + sh).r;
  c.b = texture2D(map, vUv - sh).b;
  gl_FragColor = vec4(c.rgb, uAlpha);
  #include <colorspace_fragment>
}`;

function makeCanvasMode(photos) {
  const scene = new THREE.Scene();

  const FOV = 35, TAN = Math.tan(THREE.MathUtils.degToRad(FOV / 2));
  const cam = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, .1, 200);
  const COLS = 8, ROWS = 6, CELL = 3.2, TW = COLS * CELL, TH = ROWS * CELL;
  const uVel = { value: new THREE.Vector2() }, uCam = { value: new THREE.Vector3() };
  const geo = new THREE.PlaneGeometry(1, 1, 24, 24);
  const R = rng(11), items = [];
  let k = 0;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (R() < .1) continue;
    const p = photos[k++ % photos.length];
    const size = [.58, .7, .84][R() * 3 | 0] * CELL;
    const w = p.aspect >= 1 ? size : size * p.aspect, h = p.aspect >= 1 ? size / p.aspect : size;
    const ix = R() < .3 ? CELL * .12 : 0;
    const mat = new THREE.ShaderMaterial({ uniforms: { map: { value: p.tex }, uAlpha: { value: 0 }, uVel, uCam }, vertexShader: VS, fragmentShader: FS, transparent: true });

    scene.add(m); items.push(m);

    captionPhoto: () => s.focus?.userData.p,
    enter() {

    },
    resize() { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); },
    setTheme() { scene.background.set(T().paper); },
    drag(dx, dy) {

    const h = p.aspect >= 1 ? 1.25 : 1.8, w = h * p.aspect;
    const x = side === 0 ? (R() < .5 ? -1 : 1) * (.5 + R() * .4) : side * (1.3 + R() * 1.1 + w * .3);

  }

  return {
    scene, cam,
    pickables: () => items.filter(m => m.material.opacity > .5),
    captionPhoto: () => s.nearest?.userData.p,
    enter() { if (s.fresh) { s.z = s.pz = 7; s.fresh = false; } s.idle = 0; if (s.nearest) showBig(s.nearest.userData.p.frame); },
    resize() { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); },
    setTheme() { scene.background.set(T().paper); scene.fog.color.set(T().paper); },
    wheel(dx, dy) { s.tz -= dy * .006; s.idle = 0; },
    drag(dx, dy) { s.tz += dy * .02; s.idle = 0; },
    key(k) { if (k === 'arrowdown' || k === ' ' || k === 's') { s.tz -= SP; s.idle = 0; } if (k === 'arrowup' || k === 'w') { s.tz += SP; s.idle = 0; } },

}

      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; own.push(t);
      const m = new THREE.Mesh(new THREE.PlaneGeometry(2.6, .8125), new THREE.MeshBasicMaterial({ map: t, transparent: true }));
      m.position.set(.3, .2, 0);
      g.add(m); labels.push({ c, t, title: true });
    } else {
      const p = photos[(i - 1) % photos.length];
      const h = p.aspect >= 1 ? 1.0 : 1.4, w = h * p.aspect;
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: p.tex }));
      m.userData = { p };
      const sh = new THREE.Mesh(new THREE.PlaneGeometry(w * 1.36, h * 1.36), shadowMat);
      sh.position.set(.025, -.05, -.004);
      const c = Object.assign(document.createElement('canvas'), { width: 512, height: 256 });
      drawLabel(c, p);
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; own.push(t);
      const lb = new THREE.Mesh(new THREE.PlaneGeometry(.5, .25), new THREE.MeshBasicMaterial({ map: t, transparent: true }));
      lb.position.set(w / 2 + .1 + .25, -h / 2 + .125 - .03, 0);
      g.add(sh, m, lb); photoMeshes.push(m); labels.push({ c, t, p });
    }
    scene.add(g); slots.push(g);
  }

  const s = { z: 0, tz: 0, pz: 0, x: 0, tx: 0, yaw: 0, tyaw: 0, pitch: 0, walked: 0, look: null, fresh: true };
  function release() { if (!s.look) return; s.look = null; s.tyaw = 0; s.tx = 0; setHint(INFO.room.h); }
  return {
    scene, cam, own,
    pickables: () => photoMeshes,
    captionPhoto: () => s.look?.children[1]?.userData.p,
    enter() { if (s.fresh) { s.z = s.pz = 4; s.fresh = false; } if (s.look) setHint('Scroll, click or press Esc to step back.'); },
    resize() { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); },
    setTheme() {
      const t = T();
      scene.background.set(t.paper); scene.fog.color.set(t.paper);
      paintShell(); wallTex.needsUpdate = floorTex.needsUpdate = glowTex.needsUpdate = true;
      ceilMat.color.set(t.ceil); stripMat.color.set(t.strip); shadowMat.opacity = t.shadow;
      labels.forEach(l => { l.title ? drawTitle(l.c) : drawLabel(l.c, l.p); l.t.needsUpdate = true; });
    },
    wheel(dx, dy) { release(); s.tz -= dy * .005; },
    drag(dx, dy) { release(); s.tyaw += dx * .004; s.tz += dy * .025; },
    escape: release,
    click(hit) {
      if (!hit) return release();
      const g = hit.parent, side = g.userData.side;
      if (s.look === g) return release();
      s.look = g; s.tz = g.position.z; s.tyaw = side < 0 ? Math.PI / 2 : -Math.PI / 2; s.tx = side * 1.45;
      setHint('Scroll, click or press Esc to step back.');
    },
    update(dt) {
      if (keys.has('w') || keys.has('arrowup')) { release(); s.tz -= dt * 3.2; }
      if (keys.has('s') || keys.has('arrowdown')) { release(); s.tz += dt * 3.2; }
      if (keys.has('a') || keys.has('arrowleft')) s.tyaw += dt * 1.4;
      if (keys.has('d') || keys.has('arrowright')) s.tyaw -= dt * 1.4;
      s.z = damp(s.z, s.tz, 3.5, dt); s.x = damp(s.x, s.tx, 3, dt);
      const mouse = !s.look && ptr.inside && !ptr.down && !coarse;
      s.yaw = damp(s.yaw, s.tyaw + (mouse ? -ptr.nx * .35 : 0), 4, dt);
      s.pitch = damp(s.pitch, mouse ? ptr.ny * .08 : 0, 4, dt);
      const dz = Math.abs(s.z - s.pz); s.pz = s.z; s.walked += dz;
      const bob = reduced ? 0 : Math.sin(s.walked * 2.4) * .03 * Math.min(dz / dt / 2, 1);
      cam.position.set(s.x, EYE + bob, s.z);
      cam.rotation.set(s.pitch, s.yaw, 0);
      shell.position.z = Math.floor(s.z / 4) * 4;
      for (const g of slots) {
        let rel = g.userData.bz - s.z;
        rel -= Math.ceil((rel - 4) / L) * L;
        g.position.z = s.z + rel;
      }
    },
  };
}

/* ---------- mode management ---------- */
const builders = { canvas: makeCanvasMode, tunnel: makeTunnelMode, room: makeRoomMode };
const modes = {};
let photos = [], mode = null, current = 'canvas', lastHit = null;

function activate(name) {
  current = name;
  modes[name] ||= builders[name](photos);
  mode = modes[name];
  hideBig(); bigVal = null; capP = undefined; setCaption(null);
  if (lastHit) lastHit.userData.isHover = false; lastHit = null;
  document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === name));
  $('#aboutT').textContent = INFO[name].t; setHint(INFO[name].h);
  mode.resize(); mode.enter?.();
  try { history.replaceState(null, '', '#' + name); } catch (e) {}
}
let switching = false;
function switchTo(name) {
  if (switching || (name === current && mode)) return;
  switching = true; stage.classList.add('out');
  setTimeout(() => { activate(name); stage.classList.remove('out'); switching = false; }, reduced ? 0 : 280);
}
function disposeMode(m) {
  m.scene.traverse(o => {
    o.geometry?.dispose();
    if (o.material) [].concat(o.material).forEach(mt => mt.dispose());
  });
  m.own?.forEach(t => t.dispose());
}
document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => switchTo(b.dataset.mode)));

const themeBtn = $('#themeBtn');
function applyTheme() {
  document.documentElement.dataset.theme = themeName;
  themeBtn.setAttribute('aria-pressed', themeName === 'dark');
  Object.values(modes).forEach(m => m.setTheme());
  try { localStorage.setItem('photographi-theme', themeName); } catch (e) {}
}
themeBtn.addEventListener('click', () => { themeName = themeName === 'dark' ? 'light' : 'dark'; applyTheme(); });

async function useFiles(files) {
  const imgs = [...files].filter(f => f.type.startsWith('image/'));
  if (!imgs.length) return;
  const loading = $('#loading'); loading.hidden = false;
  const list = []; let failed = 0;
  for (let i = 0; i < imgs.length; i++) {
    loading.textContent = `Developing ${i + 1} of ${imgs.length}`;
    try { list.push(await fileToPhoto(imgs[i], i)); } catch (e) { failed++; }
  }
  if (!list.length) { loading.textContent = `Could not read ${failed === 1 ? 'that file' : 'those files'}. Try JPG or PNG.`; setTimeout(() => loading.hidden = true, 4000); return; }
  Object.keys(modes).forEach(k => { disposeMode(modes[k]); delete modes[k]; });
  photos.forEach(p => p.tex.dispose());
  photos = list;
  activate(current);
  if (failed) { loading.textContent = `Skipped ${failed} file${failed > 1 ? 's' : ''} it could not read.`; setTimeout(() => loading.hidden = true, 4000); }
  else loading.hidden = true;
}
$('#file').addEventListener('change', e => useFiles(e.target.files));
const drop = $('#drop');
let dragDepth = 0;
addEventListener('dragenter', e => { if ([...e.dataTransfer.types].includes('Files')) { dragDepth++; drop.classList.add('on'); } });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; drop.classList.remove('on'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; drop.classList.remove('on'); useFiles(e.dataTransfer.files); });

addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h in builders) switchTo(h); });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); Object.values(modes).forEach(m => m.resize()); });

/* ---------- loop ---------- */
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = clamp(clock.getDelta(), 1 / 240, 1 / 20);
  if (!mode) return;
  mode.update(dt);
  const hit = ptr.inside && !ptr.down ? pick() : null;
  if (hit !== lastHit) {
    if (lastHit) lastHit.userData.isHover = false;
    if (hit) hit.userData.isHover = true;
    lastHit = hit;
  }
  el.classList.toggle('point', !!hit);
  setCaption(hit ? hit.userData.p : mode.captionPhoto?.() || null);
  renderer.render(mode.scene, mode.cam);
}

(async () => {
  document.documentElement.dataset.theme = themeName;
  themeBtn.setAttribute('aria-pressed', themeName === 'dark');
  await Promise.race([
    Promise.all(['300 100px Switzer', '400 40px Switzer', '500 40px Switzer'].map(f => document.fonts.load(f))),
    new Promise(r => setTimeout(r, 2500)),
  ]).catch(() => {});
  photos = await developPlaceholders(48);
  $('#loading').hidden = true;
  const start = location.hash.slice(1);
  activate(start in builders ? start : 'canvas');
  loop();
})();
</script>
</body>
